[package]
name = "tauri-app"
version = "5.6.0"
description = "DB Scout desktop widget"
authors = ["you"]
edition = "2021"

[lib]
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "mysql"] }
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["sync", "net", "io-util", "rt-multi-thread"] }
enigo = "0.2"
mouse_position = "0.1"
rust_xlsxwriter = "0.79"
calamine = "0.34"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
font-kit = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "gzip"], default-features = false }
arboard = "3"
oar-ocr = { version = "0.6", features = ["directml"], optional = true }

[features]
default = []
ocr = ["dep:oar-ocr"]
